<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {

	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

	}

.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;

	padding: 0;
	}

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}

	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;

	}

.leaflet-overlay-pane svg {

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }

.leaflet-vml-shape {

	}

	position: absolute;
	}


/* control positioning */

.leaflet-control {

	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

.leaflet-top {
	top: 0;

.leaflet-right {

.leaflet-bottom {
	bottom: 0;

.leaflet-left {

.leaflet-bottom .leaflet-control {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {

	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

.leaflet-zoom-animated {

}

.leaflet-zoom-anim .leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-tile,

.leaflet-container {

.leaflet-zoom-box {

/* general typography */
.leaflet-container {

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);

	}
.leaflet-bar a {
	background-color: #fff;

.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:last-child {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

.leaflet-popup {

.leaflet-popup-content-wrapper {

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,

.leaflet-oldie .leaflet-popup-content-wrapper,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

<style>
/* Layout: fixed analysis panel on the left, schematic Nairobi map filling the rest; stacks map-over-panel on phones */
:root{
  --bg:#f3f4f1; --panel:#fbfbf9; --fg:#1d2420; --muted:#5f6a63; --line:#d9ddd6;
  --land:#eceee8; --road:#c3c9c0; --road-major:#a9b1a6; --park:#dbe6d3; --label:#8a948c;
  --stella:#d6336c; --lydia:#1971c2; --grace:#2f9e44; --juma:#e67700;
  --warn:#b35c00; --warn-bg:#fff1dc; --chip:#e8ebe5;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#191f1c; --fg:#e6ebe7; --muted:#9aa59e; --line:#2c3531;
  --land:#1b2220; --road:#36403b; --road-major:#4a5650; --park:#1f2b22; --label:#6f7b74;
  --stella:#f06595; --lydia:#4dabf7; --grace:#51cf66; --juma:#ffa94d;
  --warn:#ffb867; --warn-bg:#3a2a14; --chip:#26302b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#191f1c; --fg:#e6ebe7; --muted:#9aa59e; --line:#2c3531;
  --land:#1b2220; --road:#36403b; --road-major:#4a5650; --park:#1f2b22; --label:#6f7b74;
  --stella:#f06595; --lydia:#4dabf7; --grace:#51cf66; --juma:#ffa94d;
  --warn:#ffb867; --warn-bg:#3a2a14; --chip:#26302b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:380px 1fr;height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;
  padding-block:20px 28px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:18px;
  display:flex;flex-direction:column;gap:22px;min-width:0}
#map{height:100%;background:var(--land)}
h1{font-size:21px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:13px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px;font-weight:600}
.bds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:inherit}
.bd:focus-visible,.zone:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.bd .sw{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none;background:var(--c)}
.bd b{display:block;font-size:15px}
.bd small{color:var(--muted);font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.bd[aria-pressed="false"]{opacity:.42}
.bd[aria-pressed="false"] .sw{background:transparent;border:2px solid var(--c)}
.layers{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px}
.layers label{display:flex;gap:6px;align-items:center;cursor:pointer}
.layers input{accent-color:var(--fg)}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:-6px}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.tabbody{display:flex;flex-direction:column;gap:22px}
.item.go{cursor:pointer}
.item.go:hover b{text-decoration:underline}
.zpop h3{margin:0 0 8px;font-size:15px}
.zpop .bdrow{margin:6px 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.zpop ul{margin:2px 0 4px;padding-left:16px;font-size:12px;max-height:110px;overflow:auto}
.zpop .ov{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.zpop .ov b{color:var(--stella);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.zpop .ov p{margin:4px 0;font-size:12px}
.zpop button{all:unset;cursor:pointer;margin-top:8px;font-size:12px;font-weight:600;text-decoration:underline}
.zones{display:flex;flex-direction:column;gap:6px}
.zone{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg);cursor:pointer;font:inherit;color:inherit;text-align:left}
.zone:hover,.bd:hover{border-color:var(--muted)}
.zone .zn{font-weight:600}
.zone .zc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bars{grid-column:1/-1;display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.bars span{background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 7px 1px 6px;border-radius:10px;background:var(--chip);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.item{padding:9px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.item .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .t b{font-weight:600}
.item p{margin:0;color:var(--muted);font-size:12.5px}
.tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.same{background:var(--stella);color:var(--panel)}
.tag.check{background:var(--warn-bg);color:var(--warn)}
.notes{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
.results{display:flex;flex-direction:column;margin-top:6px;max-height:220px;overflow:auto}
.results button{all:unset;cursor:pointer;padding:6px 4px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);font-size:13px}
.results button:hover{background:var(--chip)}
.results i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.results small{color:var(--muted);margin-left:auto;font-size:11px;white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{border-left:2px solid var(--line);padding-left:9px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b small{font-size:13px;color:var(--muted);font-weight:500}
.stat span{font-size:11.5px;color:var(--muted)}
/* map chrome */
.leaflet-container{font-family:var(--sans);background:var(--land)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);box-shadow:0 4px 18px rgba(0,0,0,.18)}
.leaflet-popup-content{margin:12px 14px;min-width:220px;max-width:280px;font-size:13px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--panel);color:var(--fg);border-bottom-color:var(--line)}
.leaflet-control-layers{background:var(--panel)!important;color:var(--fg);border:1px solid var(--line)!important;border-radius:7px!important;font-size:12.5px;margin-right:max(10px, env(safe-area-inset-right, 0px))!important}
.leaflet-control-layers label{display:flex;gap:4px;align-items:center}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10.5px}
.pop h3{margin:0 0 4px;font-size:15px;line-height:1.25}
.pop .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
.pop .warn{background:var(--warn-bg);color:var(--warn);padding:5px 7px;border-radius:5px;font-size:12px;margin-top:6px}
.pop ul{margin:4px 0 0;padding-left:16px;max-height:170px;overflow:auto;font-size:12px}
.pop .exact{margin-top:6px;font-size:12px;color:var(--grace);font-weight:600}
.pop .shared{margin-top:6px;font-size:12px;font-weight:600;color:var(--stella)}
.zlabel{color:var(--fg);opacity:.75;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 3px var(--land),0 0 3px var(--land);pointer-events:none;transform:translate(-50%,-50%);display:inline-block}
.rlabel{color:var(--label);font-size:10.5px;font-style:italic;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 3px var(--land),0 0 3px var(--land);transform:translate(-50%,-50%);display:inline-block}
.leaflet-div-icon{background:none;border:none}
.z-lo .zlabel.core{display:none}
.z-lo .zlabel{font-size:10px}
.z-far .rlabel{display:none}
.core-hint{position:absolute}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:11.5px;color:var(--muted);
  display:flex;flex-direction:column;gap:4px;margin-right:max(10px, env(safe-area-inset-right, 0px))!important}
.legend span{display:flex;gap:7px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.legend i.u{border-style:dashed;background:transparent}
.legend i.c.x{background:var(--muted);border:2px solid var(--fg)}
.legend i.c.a{background:color-mix(in srgb,var(--muted) 45%,transparent);border-color:var(--muted)}
.legend i.z{border-radius:3px;background:color-mix(in srgb,var(--muted) 25%,transparent)}
@media (max-width:820px){
  .legend{display:none!important}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  #map{height:62vh;order:-1}
  .panel{border-right:none;border-top:1px solid var(--line);overflow:visible;padding-right:max(16px, env(safe-area-inset-right, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px))}
  html,body{height:auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const BDS = ['Stella','Lydia','Grace','Juma'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col = bd => css('--' + bd.toLowerCase());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const on = new Set(BDS);

// ---------- schematic basemap (approximate main roads) ----------
const ROADS = [
 ['Thika Rd', 1, [[-1.2835,36.8255],[-1.2680,36.8370],[-1.2560,36.8450],[-1.2420,36.8620],[-1.2300,36.8760],[-1.2190,36.8880],[-1.2130,36.8980],[-1.2000,36.9120],[-1.1830,36.9270],[-1.1700,36.9400],[-1.1480,36.9590],[-1.1040,37.0130],[-1.0700,37.0450],[-1.0400,37.0700]]],
 ['Mombasa Rd', 1, [[-1.2960,36.8235],[-1.3040,36.8275],[-1.3150,36.8390],[-1.3250,36.8600],[-1.3300,36.8800],[-1.3420,36.9020],[-1.3620,36.9200],[-1.3900,36.9450],[-1.4250,36.9700],[-1.4500,36.9800]]],
 ['Namanga Rd', 0, [[-1.4500,36.9800],[-1.4740,36.9600],[-1.5100,36.9500]]],
 ['Ngong Rd', 1, [[-1.2920,36.8150],[-1.2995,36.8060],[-1.3000,36.7900],[-1.3000,36.7820],[-1.2990,36.7620],[-1.3060,36.7400],[-1.3200,36.7120],[-1.3400,36.6850],[-1.3610,36.6560]]],
 ['Langata Rd', 1, [[-1.3030,36.8250],[-1.3115,36.8120],[-1.3200,36.8000],[-1.3300,36.7850],[-1.3350,36.7700],[-1.3330,36.7400],[-1.3280,36.7200]]],
 ['Magadi Rd', 0, [[-1.3350,36.7700],[-1.3600,36.7620],[-1.3960,36.7600],[-1.4200,36.7550]]],
 ['Waiyaki Way', 1, [[-1.2780,36.8150],[-1.2650,36.8040],[-1.2610,36.7800],[-1.2620,36.7470],[-1.2600,36.7200]]],
 ['Kiambu Rd', 0, [[-1.2560,36.8400],[-1.2350,36.8380],[-1.2050,36.8360],[-1.1710,36.8350]]],
 ['Jogoo / Kangundo Rd', 0, [[-1.2900,36.8400],[-1.2870,36.8650],[-1.2780,36.9000],[-1.2760,36.9200],[-1.2720,36.9500],[-1.2690,36.9900]]],
 ['Eastern Bypass', 0, [[-1.1600,36.9600],[-1.1900,36.9700],[-1.2300,36.9750],[-1.2600,36.9760],[-1.2880,36.9620],[-1.3100,36.9400],[-1.3350,36.9100]]],
 ['Outer Ring Rd', 0, [[-1.2280,36.8770],[-1.2500,36.8800],[-1.2780,36.8880],[-1.3050,36.8880],[-1.3250,36.8820]]],
 ['Southern Bypass', 0, [[-1.3220,36.8500],[-1.3300,36.8150],[-1.3330,36.7900],[-1.3200,36.7450],[-1.2950,36.7250],[-1.2700,36.7050]]],
 ['Juja Rd', 0, [[-1.2800,36.8300],[-1.2720,36.8480],[-1.2620,36.8650]]],
 ['Uhuru Hwy', 0, [[-1.2700,36.8130],[-1.2850,36.8180],[-1.2960,36.8235],[-1.3030,36.8250]]],
];
const PARK = [[-1.3260,36.8080],[-1.3280,36.8450],[-1.3420,36.8800],[-1.3700,36.9000],[-1.4100,36.9200],[-1.4350,36.8900],[-1.4300,36.8300],[-1.4050,36.7800],[-1.3700,36.7700],[-1.3450,36.7800]];

const map = L.map('map', {zoomControl:true, minZoom:9, maxZoom:17, preferCanvas:false, attributionControl:true});
map.attributionControl.setPrefix('Schematic roads');
map.createPane('baseLbl').style.zIndex=350; map.createPane('zoneLbl').style.zIndex=450;
const CORE=new Set(['Upper Hill','CBD','Hurlingham / Ngong Rd','Lavington / Kilimani','Langata Rd / Nairobi West','South B / South C','Westlands','Parklands','Eastleigh / Juja Rd','Kawangware','Kangemi']);
const base = L.layerGroup().addTo(map);
function drawBase(){
  base.clearLayers();
  if(window.TILES_OK) return;
  L.polygon(PARK,{stroke:false,fillColor:css('--park'),fillOpacity:1,interactive:false}).addTo(base);
  L.marker([-1.385,36.845],{pane:'baseLbl',interactive:false,icon:L.divIcon({className:'',html:'<span class="rlabel">Nairobi National Park</span>'})}).addTo(base);
  ROADS.forEach(([n,major,pts])=>{
    L.polyline(pts,{color:css(major?'--road-major':'--road'),weight:major?3.2:2,opacity:1,interactive:false,lineCap:'round'}).addTo(base);
    const m = pts[Math.floor(pts.length/2)];
    L.marker(m,{pane:'baseLbl',interactive:false,icon:L.divIcon({className:'',html:`<span class="rlabel">${n}</span>`})}).addTo(base);
  });
}
drawBase();

// ---------- real map backgrounds (downloaded file only; the hosted page blocks map images) ----------
if (window.USE_TILES) {
  const esri = (svc, attr) => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${svc}/MapServer/tile/{z}/{y}/{x}`, {maxZoom: 19, attribution: attr});
  const BASES = {
    'Street map': esri('World_Street_Map', 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'),
    'Topographic': esri('World_Topo_Map', 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'),
    'Satellite': esri('World_Imagery', 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'),
    'Simple roads (offline)': L.layerGroup(),
  };
  const onBase = name => {
    window.TILES_OK = name !== 'Simple roads (offline)';
    if (window.TILES_OK) base.clearLayers(); else drawBase();
    map.attributionControl.setPrefix(window.TILES_OK ? false : 'Schematic roads');
  };
  BASES['Street map'].addTo(map); onBase('Street map');
  BASES['Street map'].on('tileerror', () => { if (map.hasLayer(BASES['Street map']) && !BASES['Street map']._ok) { /* offline: show drawn roads */ window.TILES_OK = false; drawBase(); } });
  BASES['Street map'].on('tileload', function(){ this._ok = true; });
  L.control.layers(BASES, null, {position: 'topright', collapsed: false}).addTo(map);
  map.on('baselayerchange', ev => onBase(ev.name));
}

// ---------- facilities ----------
const facLayer = L.layerGroup().addTo(map);
const zoneLayer = L.layerGroup().addTo(map);
const labelLayer = L.layerGroup().addTo(map);
const sharedNames = new Map(); // normalized name -> shared entry
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
D.shared.filter(s=>s.kind==='same').forEach(s=>{
  s.name.split(' / ').forEach(n=>sharedNames.set(norm(n.replace(/\(.*\)/,'')),s));
});
const markerOf = new Map();
function sharedFor(f){
  const k = norm(f.name.replace(/\(.*\)/,''));
  for (const [n,s] of sharedNames) if (k===n || (n.length>3 && k.startsWith(n))) return s.bds.includes(f.bd)?s:null;
  return null;
}
function popupHTML(f){
  const docs = f.doctors.length ? `<div class="meta" style="margin:8px 0 0">${f.doctors.length} doctor${f.doctors.length>1?'s':''} listed</div><ul>${f.doctors.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>` : '';
  const sh = sharedFor(f);
  return `<div class="pop"><h3>${esc(f.name)}</h3>
    <div class="chips"><span class="chip" style="--c:${col(f.bd)}"><i></i>${f.bd}</span><span class="chip">${esc(f.zone)}</span></div>
    ${f.sub?`<div class="meta" style="margin-top:6px">Listed under: ${esc(f.sub)}</div>`:''}
    ${sh?`<div class="shared">Also on ${sh.bds.filter(b=>b!==f.bd).join(', ')}'s list</div>`:''}
    ${docs}
</div>`;
}
function drawFacilities(){
  facLayer.clearLayers(); markerOf.clear();
  const showShared = document.getElementById('lyr-shared').checked;
  D.facilities.forEach(f=>{
    if(!on.has(f.bd)) return;
    if(showShared && !sharedZones.has(f.zone)) return;
    const r = f.doctors.length>2 ? Math.min(13, 5+Math.sqrt(f.doctors.length)*0.9) : 5.5;
    const m = L.circleMarker([f.lat,f.lng],{radius:r,color:css('--panel'),weight:1.5,fillColor:col(f.bd),fillOpacity:0.92});
    m.bindPopup(()=>popupHTML(f),{maxWidth:300});
    m.bindTooltip(esc(f.name),{direction:'top',offset:[0,-r]});
    m.addTo(facLayer); markerOf.set(f,m);
  });
}

// ---------- coverage areas: one circle per BD per area ----------
const R = 6371000, rad = x=>x*Math.PI/180;
const dist=(a,b)=>{const dLat=rad(b[0]-a[0]),dLng=rad(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const groups = {}; // zone -> bd -> [f]
D.facilities.forEach(f=>{(groups[f.zone]??={}); (groups[f.zone][f.bd]??=[]).push(f);});
const zoneBDs = {}; // confirmed BDs per zone
for (const z in groups) zoneBDs[z] = BDS.filter(b=>(groups[z][b]||[]).some(f=>f.confirmed));
const sharedZones = new Set(Object.keys(zoneBDs).filter(z=>zoneBDs[z].length>1));

function drawZones(){
  zoneLayer.clearLayers(); labelLayer.clearLayers();
  const showZ = document.getElementById('lyr-zone').checked;
  const showShared = document.getElementById('lyr-shared').checked;
  for (const z in groups){
    if (showShared && !sharedZones.has(z)) continue;
    const c = D.zones[z];
    L.marker([c[0]+(CORE.has(z)?0.0062:0.0105),c[1]],{pane:'zoneLbl',interactive:false,icon:L.divIcon({className:'',html:`<span class="zlabel${CORE.has(z)?' core':''}">${esc(z)}</span>`})}).addTo(labelLayer);
    if(!showZ) continue;
    const bds = BDS.filter(b=>on.has(b) && groups[z][b]);
    bds.forEach((b,i)=>{
      const fs = groups[z][b];
      const conf = fs.filter(f=>f.confirmed);
      const use = conf.length?conf:fs;
      const ctr = [use.reduce((s,f)=>s+f.lat,0)/use.length, use.reduce((s,f)=>s+f.lng,0)/use.length];
      const rr = Math.max(750, Math.max(...use.map(f=>dist(ctr,[f.lat,f.lng])))+380) + i*90;
      const shared = sharedZones.has(z);
      L.circle(ctr,{radius:rr,color:col(b),weight:shared?2.2:1.2,opacity:conf.length?0.9:0.5,dashArray:conf.length?null:'5 4',
        fillColor:col(b),fillOpacity:shared?0.14:0.08,interactive:false}).addTo(zoneLayer);
    });
  }
}
function redraw(){ drawZones(); drawFacilities(); }

// ---------- panel ----------
const bdWrap = document.getElementById('bds');
BDS.forEach(b=>{
  const fs = D.facilities.filter(f=>f.bd===b);
  const zs = new Set(fs.map(f=>f.zone)).size;
  const docs = fs.reduce((s,f)=>s+(f.bd==='Stella'?f.doctors.length:0),0);
  const btn = document.createElement('button');
  btn.className='bd'; btn.style.setProperty('--c',`var(--${b.toLowerCase()})`); btn.setAttribute('aria-pressed','true');
  btn.innerHTML=`<span class="sw"></span><span><b>${b}</b><small>${fs.length} facilities · ${zs} areas${docs?` · ${docs} doctors`:''}</small></span>`;
  btn.onclick=()=>{ on.has(b)?on.delete(b):on.add(b); btn.setAttribute('aria-pressed',on.has(b)); redraw(); };
  bdWrap.appendChild(btn);
});
const same = D.shared.filter(s=>s.kind==='same');
document.getElementById('stats').innerHTML = [
  [D.facilities.length,'facilities pinned'],[sharedZones.size,'shared areas'],[same.length,'facilities on two lists']
].map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('');

const chip = b=>`<span class="chip" style="--c:var(--${b.toLowerCase()})"><i></i>${b}</span>`;
const zWrap = document.getElementById('zones');
[...sharedZones].sort((a,b)=>zoneBDs[b].length-zoneBDs[a].length || a.localeCompare(b)).forEach(z=>{
  const counts = zoneBDs[z].map(b=>[b,groups[z][b].filter(f=>f.confirmed).length]);
  const tot = counts.reduce((s,[,n])=>s+n,0);
  const el = document.createElement('button'); el.className='zone';
  el.innerHTML = `<span class="zn">${esc(z)}</span><span class="zc">${counts.map(([b,n])=>`${b[0]} ${n}`).join(' · ')}</span>
    <span class="chips" style="grid-column:1/-1">${zoneBDs[z].map(chip).join('')}</span>
    <span class="bars">${counts.map(([b,n])=>`<span style="--c:var(--${b.toLowerCase()});flex:${n}"></span>`).join('')}</span>`;
  el.title = `Zoom to ${z}`;
  el.onclick=()=>openZone(z);
  zWrap.appendChild(el);
});
function openZone(z){
  const fs=D.facilities.filter(f=>f.zone===z);
  map.fitBounds(L.latLngBounds(fs.map(f=>[f.lat,f.lng])).pad(0.6),{maxZoom:14});
  const ctr=[fs.reduce((s,f)=>s+f.lat,0)/fs.length, fs.reduce((s,f)=>s+f.lng,0)/fs.length];
  const bds=BDS.filter(b=>groups[z][b]);
  const ov=same.filter(s=>s.zone===z);
  const html=`<div class="zpop"><h3>${esc(z)}</h3>
    ${bds.map(b=>`<div class="bdrow">${chip(b)}<span>${groups[z][b].length} facilit${groups[z][b].length>1?'ies':'y'}</span></div>
      <ul>${groups[z][b].map(f=>`<li>${esc(f.name)}</li>`).join('')}</ul>`).join('')}
    ${ov.length?`<div class="ov"><b>On both lists here</b>${ov.map(s=>`<p><strong>${esc(s.name)}</strong>: ${esc(s.detail)}</p>`).join('')}</div>`:''}
    <button type="button" onclick="showTab('rep')">Open the full overlap report</button></div>`;
  setTimeout(()=>L.popup({maxWidth:320,autoPan:true}).setLatLng(ctr).setContent(html).openOn(map),350);
  if(innerWidth<=820) document.getElementById('map').scrollIntoView({behavior:'smooth'});
}
function showTab(w){
  document.getElementById('tab-map').hidden = w!=='map';
  document.getElementById('tab-rep').hidden = w!=='rep';
  document.getElementById('t-map').setAttribute('aria-selected', w==='map');
  document.getElementById('t-rep').setAttribute('aria-selected', w==='rep');
  if(innerWidth<=820) document.querySelector('.tabs').scrollIntoView({behavior:'smooth'});
}
window.showTab=showTab;
document.getElementById('t-map').onclick=()=>showTab('map');
document.getElementById('t-rep').onclick=()=>showTab('rep');
function goFacility(s){
  const keys=s.name.split(' / ').map(n=>norm(n.replace(/\(.*\)/,'')));
  const f=D.facilities.find(f=>s.bds.includes(f.bd) && keys.some(k=>norm(f.name.replace(/\(.*\)/,'')).startsWith(k)));
  if(!f) return;
  if(!on.has(f.bd)){on.add(f.bd);[...bdWrap.children][BDS.indexOf(f.bd)].setAttribute('aria-pressed','true');redraw();}
  map.setView([f.lat,f.lng],16); setTimeout(()=>markerOf.get(f)?.openPopup(),300);
  if(innerWidth<=820) document.getElementById('map').scrollIntoView({behavior:'smooth'});
}
const item = (s,tag)=>`<div class="item"><div class="t"><b>${esc(s.name)}</b>${tag?`<span class="tag ${tag}">${tag==='same'?'Direct overlap':'Check'}</span>`:''}</div><div class="chips">${s.bds.map(chip).join('')}</div><p>${esc(s.detail)}</p></div>`;
document.getElementById('same').innerHTML = same.map(s=>item(s,'same')).join('');
[...document.getElementById('same').children].forEach((el,i)=>{el.classList.add('go');el.title='Show on map';el.onclick=()=>goFacility(same[i]);});
document.getElementById('check').innerHTML = D.shared.filter(s=>s.kind==='check').map(s=>item(s,'check')).join('');
document.getElementById('brands').innerHTML = D.brands.map(s=>item(s,'')).join('');
document.getElementById('notes').innerHTML = [
  'Stella\'s hospitals are sized by the number of doctors she lists there.',
  ...D.dups].map(n=>`<li>${esc(n)}</li>`).join('');

// search
const q = document.getElementById('q'), res = document.getElementById('results');
q.addEventListener('input',()=>{
  const v = q.value.trim().toLowerCase(); res.innerHTML='';
  if(v.length<2) return;
  const hits = D.facilities.filter(f=>f.name.toLowerCase().includes(v)||f.zone.toLowerCase().includes(v)||f.doctors.some(d=>d.toLowerCase().includes(v))).slice(0,40);
  if(!hits.length){res.innerHTML='<p class="sub">No facility or doctor matches that.</p>';return;}
  hits.forEach(f=>{
    const b=document.createElement('button'); b.style.setProperty('--c',`var(--${f.bd.toLowerCase()})`);
    b.innerHTML=`<i></i>${esc(f.name)}<small>${f.bd} · ${esc(f.zone)}</small>`;
    b.onclick=()=>{ if(!on.has(f.bd)){on.add(f.bd);[...bdWrap.children][BDS.indexOf(f.bd)].setAttribute('aria-pressed','true');}
      if(document.getElementById('lyr-shared').checked && !sharedZones.has(f.zone)) document.getElementById('lyr-shared').checked=false;
      redraw(); map.setView([f.lat,f.lng],15); markerOf.get(f)?.openPopup();
      if(innerWidth<=820) document.getElementById('map').scrollIntoView({behavior:'smooth'}); };
    res.appendChild(b);
  });
});
['lyr-fac','lyr-zone','lyr-shared'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{
  if(id==='lyr-fac'){ document.getElementById(id).checked?map.addLayer(facLayer):map.removeLayer(facLayer); return; }
  redraw();
}));

// legend
const Legend = L.Control.extend({options:{position:'bottomright'},onAdd(){
  const d=L.DomUtil.create('div','legend');
  d.innerHTML='<span><i class="c x"></i>Facility</span><span><i class="z"></i>BD coverage area</span><span style="font-size:11px">Click a shared area for its details</span>';
  return d;}});
map.addControl(new Legend());

const zcls=()=>{const z=map.getZoom(); const c=map.getContainer().classList; c.toggle('z-lo',z<13); c.toggle('z-far',z<11);};
map.on('zoomend',zcls);
redraw();
const core = D.facilities.filter(f=>f.lat<-1.14 && f.lat>-1.42);
map.fitBounds(L.latLngBounds(core.map(f=>[f.lat,f.lng])).pad(0.04)); zcls();
// repaint basemap and markers when the theme flips
const mq = matchMedia('(prefers-color-scheme: dark)');
const repaint=()=>{drawBase(); redraw();};
mq.addEventListener?.('change',repaint);
new MutationObserver(repaint).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
</body></html>
